<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>SR Plastic Admin</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#14202b}.wrap{max-width:1000px;margin:auto;padding:18px}.panel{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;border:1px solid #ccd4dd;border-radius:9px}button{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.danger{background:#fee;color:#a00}.row{display:grid;grid-template-columns:80px 1fr 120px 120px;gap:10px;align-items:center;border-top:1px solid #eee;padding:12px 0}.row img{width:70px;height:70px;object-fit:cover;border-radius:9px}.hidden{display:none}.muted{color:#667}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.msg{padding:10px;border-radius:9px;background:#eef7ee;margin:10px 0}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.row{grid-template-columns:65px 1fr}.row .rate,.row .save{grid-column:2}.row img{width:60px;height:60px}}
</style></head><body><div class="wrap">
<div class="top"><h1>SR Plastic Admin</h1><button onclick="logout()">Logout</button></div>
<div id="login" class="panel"><h2>Admin Login</h2><p class="muted">Enter the admin password configured in Cloudflare.</p><input id="pw" type="password" placeholder="Admin password"><button class="primary" onclick="login()">Login</button></div>
<div id="app" class="hidden"><div id="msg"></div><div class="panel"><h2>Product Manager</h2><div class="actions"><button class="primary" onclick="load()">Refresh</button><button onclick="showAdd()">+ Add Product</button></div><p class="small muted">Changes are saved online, so customers see them on the same website. Image upload is supported by pasting an image URL for now.</p></div>
<div id="add" class="panel hidden"><h3>New Product</h3><input id="an" placeholder="Product name"><input id="ac" placeholder="Category"><input id="ar" type="number" step="0.01" placeholder="Rate"><input id="ad" placeholder="Packaging / details"><input id="ai" placeholder="Image URL (optional)"><div class="actions"><button class="primary" onclick="addProduct()">Add</button><button onclick="hideAdd()">Cancel</button></div></div>
<div id="list" class="panel"></div></div></div>
<script>
let token=sessionStorage.getItem('sr_admin_token')||'';
const $=id=>document.getElementById(id);
function setMsg(t,good=true){$('msg').innerHTML='<div class="msg" style="background:'+(good?'#eef7ee':'#fff0f0')+'">'+t+'</div>';}
function show(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); load(); }
if(token) show();
async function login(){token=$('pw').value; let r=await fetch('/api/products',{headers:{Authorization:'Bearer '+token}}); if(r.ok){sessionStorage.setItem('sr_admin_token',token);show()}else{setMsg('Wrong password',false)}}
function logout(){sessionStorage.removeItem('sr_admin_token');location.reload()}
async function load(){let r=await fetch('/api/products',{headers:{Authorization:'Bearer '+token}});if(r.status===401)return logout();let d=await r.json();render(d.products||[]);}
function render(ps){$('list').innerHTML='<h3>'+ps.length+' products</h3>'+ps.map(p=>`<div class="row"><img src="${esc(p.image||'')}" onerror="this.style.visibility='hidden'"><div><b>${esc(p.name)}</b><div class="small muted">ID ${p.id} • ${esc(p.category||'')}</div><input id="n${p.id}" value="${attr(p.name)}"><input id="d${p.id}" value="${attr(p.detail||'')}"></div><div class="rate"><label>Rate</label><input id="r${p.id}" type="number" step="0.01" value="${p.rate}"></div><div class="save"><button class="primary" onclick="save(${p.id})">Save</button></div></div>`).join('')}
async function save(id){let body={id,name:$('n'+id).value,detail:$('d'+id).value,rate:Number($('r'+id).value)};let r=await fetch('/api/products',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});setMsg(r.ok?'Saved. Customers will see the updated rate.':'Save failed.',r.ok);}
function showAdd(){$('add').classList.remove('hidden')}function hideAdd(){$('add').classList.add('hidden')}
async function addProduct(){let body={name:$('an').value,category:$('ac').value,rate:Number($('ar').value),detail:$('ad').value,image:$('ai').value||'assets/product-1.jpg'};let r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});if(r.ok){setMsg('Product added.');hideAdd();load()}else setMsg('Could not add product.',false)}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function attr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
</script></body></html>
