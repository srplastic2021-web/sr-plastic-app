<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>SR Plastic Admin</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#14202b}.wrap{max-width:1050px;margin:auto;padding:18px}.panel{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;border:1px solid #ccd4dd;border-radius:9px;font:inherit}textarea{min-height:80px}button{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.danger{background:#fee;color:#a00}.green{background:#e9f8ef;color:#075f45}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#667}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.row{border-top:1px solid #eee;padding:18px 0}.prodhead{display:flex;gap:12px;align-items:center}.prodhead img{width:78px;height:78px;object-fit:cover;border-radius:10px;background:#eee}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stockline{display:flex;align-items:center;gap:8px;margin:5px 0 12px}.stockline input{width:auto;margin:0}.gallery{display:flex;gap:8px;overflow:auto;margin:8px 0}.gallery div{position:relative;flex:0 0 auto}.gallery img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #ddd}.gallery button{position:absolute;right:-4px;top:-4px;width:24px;height:24px;padding:0;border-radius:50%;background:#a00;color:#fff}.badge{font-weight:800}.out{color:#a00}.filebox{border:2px dashed #cbd7e1;border-radius:12px;padding:12px;background:#f8fbfd}.filebox input{border:0;padding:5px 0}.preview{display:flex;gap:7px;overflow:auto;margin:7px 0}.preview img{width:65px;height:65px;object-fit:cover;border-radius:8px}.msg{padding:10px;border-radius:9px;margin:10px 0;background:#eef7ee}.err{background:#fff0f0;color:#900}@media(max-width:700px){.two{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body><div class="wrap">
<div class="top"><h1>SR Plastic Admin</h1><button onclick="logout()">Logout</button></div>
<div id="login" class="panel"><h2>Admin Login</h2><input id="pw" type="password" placeholder="Admin password"><button class="primary" onclick="login()">Login</button></div>
<div id="app" class="hidden"><div id="msg"></div>
<div class="panel"><h2>Product Manager</h2><div class="actions"><button class="primary" onclick="load()">Refresh</button><button onclick="showAdd()">+ Add Product</button></div><p class="small muted">You can edit products, delete products, mark stock status, and upload multiple photos directly from your phone.</p></div>
<div id="add" class="panel hidden"><h3>New Product</h3><div class="two"><div><input id="an" placeholder="Product name"><input id="ac" placeholder="Category"><input id="ar" type="number" step="0.01" placeholder="Rate"><input id="ad" placeholder="Packaging / details"></div><div><div class="filebox"><b>Upload product photos</b><input id="af" type="file" accept="image/*" multiple onchange="previewFiles(this,'aprev')"><div id="aprev" class="preview"></div></div><label class="stockline"><input id="as" type="checkbox" checked> <span>In Stock</span></label></div></div><div class="actions"><button class="primary" onclick="addProduct()">Add Product</button><button onclick="hideAdd()">Cancel</button></div></div>
<div id="list" class="panel"></div></div></div>
<script>
let token=sessionStorage.getItem('sr_admin_token')||'';const $=id=>document.getElementById(id);
function msg(t,good=true){$('msg').innerHTML='<div class="msg '+(good?'':'err')+'">'+t+'</div>';}
async function login(){token=$('pw').value.trim();if(!token)return msg('Enter your admin password.',false);let r=await fetch('/api/products',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(r.ok){sessionStorage.setItem('sr_admin_token',token);show()}else msg('Wrong password.',false)}
function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}
function logout(){sessionStorage.removeItem('sr_admin_token');location.reload()}
if(token)show();
async function load(){let r=await fetch('/api/products',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(r.status===401)return logout();let d=await r.json();render(d.products||[])}
async function compressImage(file){
if(!file.type.startsWith('image/'))throw new Error('Only image files are allowed.');
const maxSide=1400,quality=.78;
const bitmap=await createImageBitmap(file);let w=bitmap.width,h=bitmap.height;
const scale=Math.min(1,maxSide/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(bitmap,0,0,w,h);bitmap.close();
const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',quality));if(!blob)throw new Error('Could not process image.');
const buf=await blob.arrayBuffer();let binary='';const bytes=new Uint8Array(buf);const chunk=0x8000;
for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
return{mime:'image/jpeg',data:btoa(binary)}
}
async function upload(file){const b=await compressImage(file);let r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(b)});let d=await r.json();if(!r.ok)throw new Error(d.error||'Upload failed');return d.url}
async function uploadFiles(files){const urls=[];for(const f of files)urls.push(await upload(f));return urls}
function previewFiles(input,id){const el=$(id);el.innerHTML='';[...input.files].forEach(f=>{const im=document.createElement('img');im.src=URL.createObjectURL(f);el.appendChild(im)})}
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function attr(s){return esc(s).replace(/"/g,'&quot;')}
function render(ps){$('list').innerHTML='<h3>'+ps.length+' products</h3>'+ps.map(p=>{const imgs=Array.isArray(p.images)&&p.images.length?p.images:(p.image?[p.image]:[]);return `<div class="row"><div class="prodhead"><img src="${esc(imgs[0]||'')}" onerror="this.style.visibility='hidden'"><div><b>${esc(p.name)}</b><div class="small muted">ID ${p.id} • ${esc(p.category||'')}</div><span class="badge ${p.stock===false?'out':''}">${p.stock===false?'OUT OF STOCK':'IN STOCK'}</span></div></div><div class="two"><div><label>Product name</label><input id="n${p.id}" value="${attr(p.name)}"><label>Category</label><input id="c${p.id}" value="${attr(p.category||'Other')}"><label>Details</label><input id="d${p.id}" value="${attr(p.detail||'')}"><label>Rate</label><input id="r${p.id}" type="number" step="0.01" value="${p.rate}"><label class="stockline"><input id="s${p.id}" type="checkbox" ${p.stock===false?'':'checked'}> <span>In Stock / Available</span></label></div><div><div class="filebox"><b>Add more photos</b><input id="f${p.id}" type="file" accept="image/*" multiple onchange="previewFiles(this,'pv${p.id}')"><div id="pv${p.id}" class="preview"></div></div><div class="small muted">Current photos (tap ✕ to remove)</div><div class="gallery">${imgs.map((u,i)=>`<div><img src="${esc(u)}"><button type="button" onclick="removeImg(${p.id},${i})">×</button></div>`).join('')}</div><div class="actions"><button class="primary" onclick="save(${p.id})">Save</button><button class="danger" onclick="del(${p.id},'${attr(p.name)}')">🗑 Delete</button></div></div></div></div>`}).join('')}
function currentImages(id){const p=window.PRODS.find(x=>x.id===id);return p&&Array.isArray(p.images)?[...p.images]:(p&&p.image?[p.image]:[])}
window.PRODS=[];
async function refreshData(){let r=await fetch('/api/products',{headers:{Authorization:'Bearer '+token},cache:'no-store'});let d=await r.json();window.PRODS=d.products||[];render(window.PRODS)}
async function save(id){try{const p=window.PRODS.find(x=>x.id===id);let imgs=currentImages(id);const files=[...($('f'+id).files||[])];if(files.length)imgs=imgs.concat(await uploadFiles(files));let body={id,name:$('n'+id).value,category:$('c'+id).value,detail:$('d'+id).value,rate:Number($('r'+id).value),images:imgs,image:imgs[0]||'',stock:$('s'+id).checked};let r=await fetch('/api/products',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});if(!r.ok){let d=await r.json();throw Error(d.error||'Save failed')}msg('Saved successfully.');await refreshData()}catch(e){msg(e.message,false)}}
async function removeImg(id,i){try{const p=window.PRODS.find(x=>x.id===id);let imgs=currentImages(id);const u=imgs.splice(i,1)[0];if(u)await fetch('/api/images',{method:'DELETE',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({url:u})});await fetch('/api/products',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id,name:$('n'+id).value,category:$('c'+id).value,detail:$('d'+id).value,rate:Number($('r'+id).value),images:imgs,image:imgs[0]||'',stock:$('s'+id).checked})});await refreshData()}catch(e){msg(e.message,false)}}
async function del(id,name){if(!confirm('Delete '+name+' permanently?'))return;let r=await fetch('/api/products',{method:'DELETE',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id})});if(r.ok){msg('Product deleted.');await refreshData()}else msg('Delete failed.',false)}
function showAdd(){$('add').classList.remove('hidden')}function hideAdd(){$('add').classList.add('hidden')}
async function addProduct(){try{const files=[...($('af').files||[])];if(!$('an').value.trim())return msg('Enter product name.',false);const imgs=files.length?await uploadFiles(files):[];let body={name:$('an').value,category:$('ac').value,rate:Number($('ar').value),detail:$('ad').value,images:imgs,image:imgs[0]||'',stock:$('as').checked};let r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});if(!r.ok){let d=await r.json();throw Error(d.error||'Could not add product')}msg('Product added successfully.');hideAdd();['an','ac','ar','ad'].forEach(id=>$(id).value='');$('af').value='';$('aprev').innerHTML='';await refreshData()}catch(e){msg(e.message,false)}}
</script></body></html>
