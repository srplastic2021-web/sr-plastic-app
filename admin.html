<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>SR Plastic Admin</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#14202b}.wrap{max-width:1050px;margin:auto;padding:18px}.panel{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;border:1px solid #ccd4dd;border-radius:9px;font:inherit}textarea{min-height:90px}button{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.danger{background:#fee;color:#a00}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.msg{padding:10px;border-radius:9px;background:#eef7ee;margin:10px 0}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.stock{font-weight:800}.gallery{display:flex;gap:8px;overflow:auto;margin:4px 0 10px}.gallery img{width:62px;height:62px;object-fit:cover;border-radius:8px;border:1px solid #ddd}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stockline{display:flex;align-items:center;gap:10px;margin:5px 0 10px}.stockline input{width:auto;margin:0}.hidden{display:none}.upload{border:2px dashed #ccd4dd;border-radius:10px;padding:14px;text-align:center;margin:6px 0 12px;background:#fafbfd}.preview{width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin-top:8px}.hint{color:#667;font-size:13px}@media(max-width:700px){.two{grid-template-columns:1fr}.prodhead{align-items:flex-start}.prodhead img{width:65px;height:65px}}
</style></head><body><div class="wrap">
<div class="top"><h1>SR Plastic Admin</h1><button onclick="logout()">Logout</button></div>
<div id="login" class="panel"><h2>Admin Login</h2><p class="hint">Enter the admin password configured in Cloudflare.</p><input id="pw" type="password" placeholder="Admin password"><button class="primary" onclick="login()">Login</button></div>
<div id="app" class="hidden"><div id="msg"></div>
<div class="panel"><h2>Product Manager</h2><div class="actions"><button class="primary" onclick="load()">Refresh</button><button onclick="showAdd()">+ Add Product</button></div><p class="small hint">Add or edit products. You can upload a photo directly from your phone Gallery. Changes are saved online and appear on the same customer website.</p></div>
<div id="add" class="panel hidden"><h3>New Product</h3><div class="two"><div><input id="an" placeholder="Product name"><input id="ac" placeholder="Category"><input id="ar" type="number" step="0.01" placeholder="Rate"><input id="ad" placeholder="Packaging / details"></div><div>
<label class="small">Product Photo</label><div class="upload"><input id="af" type="file" accept="image/*" onchange="previewNew()"><div class="hint">Choose photo from your phone</div><img id="ap" class="preview hidden"></div>
<label class="small">Or Image URL (optional)</label><input id="ai" placeholder="https://..."><label class="stockline"><input id="as" type="checkbox" checked> <span>In Stock</span></label></div></div><div class="actions"><button class="primary" onclick="addProduct()">Add Product</button><button onclick="hideAdd()">Cancel</button></div></div>
<div id="list" class="panel"></div></div></div>
<script>
let token=sessionStorage.getItem('sr_admin_token')||'';const $=id=>document.getElementById(id);
function setMsg(t,good=true){$('msg').innerHTML='<div class="msg" style="background:'+(good?'#eef7ee':'#fff0f0')+'">'+t+'</div>';window.scrollTo({top:0,behavior:'smooth'})}
function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}
if(token)show();
async function login(){token=$('pw').value.trim();let r=await fetch('/api/products',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(r.ok){sessionStorage.setItem('sr_admin_token',token);show()}else setMsg('Wrong password',false)}
function logout(){sessionStorage.removeItem('sr_admin_token');location.reload()}
async function load(){let r=await fetch('/api/products',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(r.status===401)return logout();if(!r.ok)return setMsg('Could not load products.',false);let d=await r.json();render(d.products||[])}
function render(ps){$('list').innerHTML='<h3>'+ps.length+' products</h3>'+ps.map(p=>{let imgs=Array.isArray(p.images)&&p.images.length?p.images:(p.image?[p.image]:[]);return `<div class="row" style="border-top:1px solid #eee;padding:16px 0"><div class="prodhead"><img src="${esc(imgs[0]||'')}" onerror="this.style.visibility='hidden'" style="width:80px;height:80px;object-fit:cover;border-radius:10px"><div><b>${esc(p.name)}</b><div class="small hint">ID ${p.id} • ${esc(p.category||'')}</div><span class="stock" style="color:${p.stock===false?'#a00':'#075f45'}">${p.stock===false?'OUT OF STOCK':'IN STOCK'}</span></div></div><div class="two"><div><label>Product name</label><input id="n${p.id}" value="${attr(p.name)}"><label>Category</label><input id="c${p.id}" value="${attr(p.category||'Other')}"><label>Details</label><input id="d${p.id}" value="${attr(p.detail||'')}"><label>Rate</label><input id="r${p.id}" type="number" step="0.01" value="${p.rate}"></div><div><label>Replace Photo</label><div class="upload"><input id="f${p.id}" type="file" accept="image/*" onchange="previewEdit(${p.id})"><div class="hint">Choose a new photo only if you want to replace the current one</div><img id="pv${p.id}" class="preview hidden"></div><label>Image URL (optional)</label><input id="i${p.id}" value="${attr((imgs.find(u=>!String(u).startsWith('/api/images/')))||'')}"><label class="stockline"><input id="s${p.id}" type="checkbox" ${p.stock===false?'':'checked'}> <span>In Stock / Available</span></label><div class="actions"><button class="primary" onclick="save(${p.id})">Save</button><button class="danger" onclick="del(${p.id},'${attr(p.name)}')">🗑 Delete</button></div></div></div><div class="gallery">${imgs.map(u=>`<img src="${esc(u)}" onerror="this.style.display='none'">`).join('')}</div></div>`}).join('')}
function readImage(file,max=140000){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(!file.type.startsWith('image/'))return reject(new Error('Please choose an image file.'));const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;const scale=Math.min(1,1200/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);let q=.82;let out=c.toDataURL('image/jpeg',q);while(out.length>max&&q>.35){q-=.07;out=c.toDataURL('image/jpeg',q)}resolve(out)};im.onerror=()=>reject(new Error('Could not read image.'));im.src=fr.result};fr.onerror=()=>reject(fr.error||new Error('Could not read file.'));fr.readAsDataURL(file)})}
function previewNew(){const f=$('af').files[0];if(!f)return;$('ap').src=URL.createObjectURL(f);$('ap').classList.remove('hidden')}
function previewEdit(id){const f=$('f'+id).files[0];const p=$('pv'+id);if(!f){p.classList.add('hidden');return}p.src=URL.createObjectURL(f);p.classList.remove('hidden')}
async function addProduct(){try{const f=$('af').files[0];const imageData=await readImage(f);const url=$('ai').value.trim();let body={name:$('an').value.trim(),category:$('ac').value.trim(),rate:Number($('ar').value),detail:$('ad').value.trim(),image:url,images:url?[url]:[],imageData,stock:$('as').checked};if(!body.name)return setMsg('Product name is required.',false);if(!body.rate)return setMsg('Rate is required.',false);let r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});if(r.ok){setMsg('Product added successfully.');hideAdd();$('an').value='';$('ac').value='';$('ar').value='';$('ad').value='';$('ai').value='';$('af').value='';$('ap').classList.add('hidden');load()}else{let d=await r.json().catch(()=>({}));setMsg(d.error||'Could not add product.',false)}}catch(e){setMsg(e.message||'Photo upload failed.',false)}}
async function save(id){try{const f=$('f'+id).files[0];const imageData=await readImage(f);const url=$('i'+id).value.trim();let body={id,name:$('n'+id).value,category:$('c'+id).value,detail:$('d'+id).value,rate:Number($('r'+id).value),images:url?[url]:[],image:url,stock:$('s'+id).checked};if(imageData)body.imageData=imageData;let r=await fetch('/api/products',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});if(r.ok){setMsg('Saved successfully.');load()}else setMsg('Save failed.',false)}catch(e){setMsg(e.message||'Photo upload failed.',false)}}
async function del(id,name){if(!confirm('Delete '+name+' permanently?'))return;let r=await fetch('/api/products',{method:'DELETE',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id})});if(r.ok){setMsg('Product deleted.');load()}else setMsg('Delete failed.',false)}
function showAdd(){$('add').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}function hideAdd(){$('add').classList.add('hidden')}
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function attr(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'&#10;')}
</script></body></html>
