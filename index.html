<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>SR Plastic Admin</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#14202b}.wrap{max-width:1050px;margin:auto;padding:18px}.panel{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;border:1px solid #ccd4dd;border-radius:9px;font:inherit}textarea{min-height:90px}button{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.danger{background:#fee;color:#a00}.green{background:#e9f8ef;color:#075f45}.row{border-top:1px solid #eee;padding:16px 0}.prodhead{display:flex;gap:12px;align-items:center}.prodhead img{width:80px;height:80px;object-fit:cover;border-radius:10px;background:#eee}.muted{color:#667}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.msg{padding:10px;border-radius:9px;background:#eef7ee;margin:10px 0}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.stock{font-weight:800}.gallery{display:flex;gap:8px;overflow:auto;margin:4px 0 10px}.gallery img{width:62px;height:62px;object-fit:cover;border-radius:8px;border:1px solid #ddd}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stockline{display:flex;align-items:center;gap:10px;margin:5px 0 10px}.stockline input{width:auto;margin:0}.hidden{display:none}@media(max-width:700px){.two{grid-template-columns:1fr}.prodhead{align-items:flex-start}.prodhead img{width:65px;height:65px}}
</style></head><body><div class="wrap">
<div class="top"><h1>SR Plastic Admin</h1><button onclick="logout()">Logout</button></div>
<div id="login" class="panel"><h2>Admin Login</h2><p class="muted">Enter the admin password configured in Cloudflare.</p><input id="pw" type="password" placeholder="Admin password"><button class="primary" onclick="login()">Login</button></div>
<div id="app" class="hidden"><div id="msg"></div>
<div class="panel"><h2>Product Manager</h2><div class="actions"><button class="primary" onclick="load()">Refresh</button><button onclick="showAdd()">+ Add Product</button></div><p class="small muted">Edit products, mark them out of stock, delete them, or add multiple image URLs (one per line). Changes are saved online and appear on the same customer website.</p></div>
<div id="add" class="panel hidden"><h3>New Product</h3><div class="two"><div><input id="an" placeholder="Product name"><input id="ac" placeholder="Category"><input id="ar" type="number" step="0.01" placeholder="Rate"><input id="ad" placeholder="Packaging / details"></div><div><label class="small muted">Image URLs (one per line)</label><textarea id="ai" placeholder="assets/product-1.jpg&#10;assets/product-1-2.jpg"></textarea><label class="stockline"><input id="as" type="checkbox" checked> <span>In Stock</span></label></div></div><div class="actions"><button class="primary" onclick="addProduct()">Add Product</button><button onclick="hideAdd()">Cancel</button></div></div>
<div id="list" class="panel"></div></div></div>
<script>
let token=sessionStorage.getItem('sr_admin_token')||''; const $=id=>document.getElementById(id);
function setMsg(t,good=true){$('msg').innerHTML='<div class="msg" style="background:'+(good?'#eef7ee':'#fff0f0')+'">'+t+'</div>';}
function show(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); load(); }
if(token) show();
async function login(){token=$('pw').value;let r=await fetch('/api/products',{headers:{Authorization:'Bearer '+token}});if(r.ok){sessionStorage.setItem('sr_admin_token',token);show()}else setMsg('Wrong password',false)}
function logout(){sessionStorage.removeItem('sr_admin_token');location.reload()}
async function load(){let r=await fetch('/api/products',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(r.status===401)return logout();let d=await r.json();render(d.products||[])}
function render(ps){$('list').innerHTML='<h3>'+ps.length+' products</h3>'+ps.map(p=>{let imgs=Array.isArray(p.images)&&p.images.length?p.images:[p.image||''];return `<div class="row"><div class="prodhead"><img src="${esc(imgs[0])}" onerror="this.style.visibility='hidden'"><div><b>${esc(p.name)}</b><div class="small muted">ID ${p.id} • ${esc(p.category||'')}</div><span class="stock" style="color:${p.stock===false?'#a00':'#075f45'}">${p.stock===false?'OUT OF STOCK':'IN STOCK'}</span></div></div><div class="two"><div><label>Product name</label><input id="n${p.id}" value="${attr(p.name)}"><label>Category</label><input id="c${p.id}" value="${attr(p.category||'Other')}"><label>Details</label><input id="d${p.id}" value="${attr(p.detail||'')}"><label>Rate</label><input id="r${p.id}" type="number" step="0.01" value="${p.rate}"></div><div><label>Image URLs <span class="small muted">(one per line)</span></label><textarea id="i${p.id}">${esc(imgs.join('\n'))}</textarea><label class="stockline"><input id="s${p.id}" type="checkbox" ${p.stock===false?'':'checked'}> <span>In Stock / Available</span></label><div class="actions"><button class="primary" onclick="save(${p.id})">Save</button><button class="danger" onclick="del(${p.id},'${attr(p.name)}')">🗑 Delete</button></div></div></div><div class="gallery">${imgs.map(u=>`<img src="${esc(u)}" onerror="this.style.display='none'">`).join('')}</div></div>`}).join('')}
async function save(id){let imgs=$('i'+id).value.split(/\n+/).map(s=>s.trim()).filter(Boolean);let body={id,name:$('n'+id).value,category:$('c'+id).value,detail:$('d'+id).value,rate:Number($('r'+id).value),images:imgs,image:imgs[0]||'',stock:$('s'+id).checked};let r=await fetch('/api/products',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});if(r.ok){setMsg('Saved successfully.');load()}else setMsg('Save failed.',false)}
async function del(id,name){if(!confirm('Delete '+name+' permanently?'))return;let r=await fetch('/api/products',{method:'DELETE',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id})});if(r.ok){setMsg('Product deleted.');load()}else setMsg('Delete failed.',false)}
function showAdd(){$('add').classList.remove('hidden')}function hideAdd(){$('add').classList.add('hidden')}
async function addProduct(){let imgs=$('ai').value.split(/\n+/).map(s=>s.trim()).filter(Boolean);if(!imgs.length)imgs=['assets/product-1.jpg'];let body={name:$('an').value,category:$('ac').value,rate:Number($('ar').value),detail:$('ad').value,images:imgs,image:imgs[0],stock:$('as').checked};let r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});if(r.ok){setMsg('Product added.');hideAdd();$('an').value='';$('ac').value='';$('ar').value='';$('ad').value='';$('ai').value='';load()}else setMsg('Could not add product.',false)}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function attr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script></body></html>
